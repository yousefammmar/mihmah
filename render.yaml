# Render Blueprint for the free deployment described in docs/DEPLOY-FREE.md.
# Values marked `sync: false` are secrets or account-specific: Render asks for them when the Blueprint
# is created and stores them in the dashboard. They never belong in this file or in Git.
services:
  - type: web
    name: mihmah
    runtime: node
    plan: free
    region: frankfurt # closest Render region to Jordan; keep Neon (Frankfurt) and B2 (EU Central) nearby
    buildCommand: npm ci --omit=dev
    startCommand: npm start # applies pending migrations on boot
    healthCheckPath: /healthz # does not touch the database, so health checks don't keep Neon awake
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: APP_URL
        sync: false # https://<service>.onrender.com, exactly as Render shows it
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_URL
        sync: false # Neon direct (non-pooled) connection string
      - key: FILE_URL_SECRET
        generateValue: true
      - key: MAIL_PROVIDER
        value: smtp
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "2525" # Render free blocks outbound 465 and 587; Brevo also listens on 2525
      - key: SMTP_SECURE
        value: "false" # STARTTLS upgrade on 2525
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: PAYMENTS_PROVIDER
        value: none
      - key: DEMO_MODE
        value: "false"
