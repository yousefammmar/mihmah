# Runs the full test suite on every push to main and every pull request.
# Tests start throwaway PostgreSQL clusters from the embedded-postgres dev dependency, so no database service is needed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: find server public/js scripts test -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run tests
        run: npm test
